<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages SPA redirect restore (pairs with public/404.html). Harmless elsewhere. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg" />
    <meta
      name="description"
      content="NIRO Lab — NSU Intelligent Robotics Lab at North South University, Dhaka. Advancing robotics research through innovation and collaboration."
    />
