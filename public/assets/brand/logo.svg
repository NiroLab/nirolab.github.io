<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NIRO Lab logo">
  <g fill="none" fill-rule="evenodd">
    <!-- orbit ring tilted 18deg -->
    <g transform="rotate(18 32 32)">
      <ellipse cx="32" cy="32" rx="28" ry="16" stroke="#3D8FE0" stroke-width="1.5"/>
      <circle cx="57.5" cy="23.5" r="3.2" fill="#F2A900" stroke="none"/>
    </g>
    <!-- geometric N built from circuit traces -->
    <g stroke="#1B5FAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 44V20l20 24V20" fill="none"/>
    </g>
    <g fill="#1B5FAA">
      <circle cx="22" cy="20" r="2.6"/>
      <circle cx="22" cy="44" r="2.6"/>
      <circle cx="42" cy="20" r="2.6"/>
      <circle cx="42" cy="44" r="2.6"/>
    </g>
  </g>
</svg>
