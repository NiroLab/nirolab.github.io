<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NIRO Lab social share card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B141A"/>
      <stop offset="1" stop-color="#10222C"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#0E7C8C" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2FB8CE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2FB8CE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- orbit ring motif right -->
  <g transform="rotate(18 980 315)" fill="none" stroke="#2FB8CE" stroke-width="3" stroke-opacity="0.8">
    <ellipse cx="980" cy="315" rx="200" ry="112"/>
  </g>
  <circle cx="980" cy="315" r="86" fill="none" stroke="#2FB8CE" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="1164" cy="267" r="11" fill="#E8A33D"/>
  <g stroke="#0E7C8C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M940 355V275l80 80v-80" fill="none"/>
  </g>
  <!-- wordmark -->
  <rect x="80" y="180" width="46" height="6" fill="#2FB8CE"/>
  <text x="80" y="160" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="8" fill="#2FB8CE">// NSU INTELLIGENT ROBOTICS LAB</text>
  <text x="76" y="300" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="76" fill="#FFFFFF">NIRO Lab</text>
  <text x="80" y="370" font-family="Inter, Arial, sans-serif" font-size="28" fill="#B9D3DB">NSU Intelligent Robotics Lab</text>
  <text x="80" y="430" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4E6570">Advancing robotics research through innovation and collaboration</text>
  <text x="80" y="540" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="4" fill="#2FB8CE" fill-opacity="0.8">NORTH SOUTH UNIVERSITY · DHAKA · EST. 2024</text>
</svg>
