<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="NIRO Lab workspace placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2A5E"/>
      <stop offset="0.65" stop-color="#123C7A"/>
      <stop offset="1" stop-color="#061A3A"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2C5A"/>
      <stop offset="1" stop-color="#061A3A"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#3D8FE0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3D8FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect y="620" width="1600" height="380" fill="url(#floor)"/>
  <rect width="1600" height="1000" fill="url(#lamp)"/>
  <!-- ceiling lights -->
  <g fill="#E9F2FC" fill-opacity="0.7">
    <rect x="240" y="70" width="220" height="10" rx="5"/>
    <rect x="690" y="70" width="220" height="10" rx="5"/>
    <rect x="1140" y="70" width="220" height="10" rx="5"/>
  </g>
  <!-- workbenches -->
  <g>
    <rect x="120" y="500" width="420" height="26" rx="6" fill="#1B5FAA" fill-opacity="0.8"/>
    <rect x="150" y="526" width="18" height="160" fill="#0A2A5E"/>
    <rect x="490" y="526" width="18" height="160" fill="#0A2A5E"/>
    <rect x="1060" y="500" width="420" height="26" rx="6" fill="#1B5FAA" fill-opacity="0.8"/>
    <rect x="1090" y="526" width="18" height="160" fill="#0A2A5E"/>
    <rect x="1430" y="526" width="18" height="160" fill="#0A2A5E"/>
  </g>
  <!-- 3D printers on bench -->
  <g fill="none" stroke="#3D8FE0" stroke-width="3" stroke-opacity="0.8">
    <rect x="200" y="400" width="120" height="100" rx="8"/>
    <path d="M200 430h120M260 400v100"/>
    <rect x="1160" y="400" width="120" height="100" rx="8"/>
    <path d="M1160 430h120M1220 400v100"/>
  </g>
  <!-- monitors -->
  <g>
    <rect x="360" y="420" width="130" height="80" rx="6" fill="#061A3A" stroke="#3D8FE0" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M375 470l25-22 20 14 30-30 25 20" stroke="#3D8FE0" stroke-width="2.5" fill="none"/>
    <rect x="1310" y="420" width="130" height="80" rx="6" fill="#061A3A" stroke="#3D8FE0" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M1325 450h100M1325 468h70M1325 486h85" stroke="#3D8FE0" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>
  <!-- differential-drive robot center -->
  <g transform="translate(800 700)">
    <ellipse cx="0" cy="86" rx="150" ry="18" fill="#061A3A" fill-opacity="0.7"/>
    <rect x="-110" y="-10" width="220" height="80" rx="20" fill="#1B5FAA"/>
    <rect x="-110" y="-10" width="220" height="80" rx="20" fill="none" stroke="#3D8FE0" stroke-width="3"/>
    <circle cx="-70" cy="70" r="26" fill="#061A3A" stroke="#3D8FE0" stroke-width="3"/>
    <circle cx="70" cy="70" r="26" fill="#061A3A" stroke="#3D8FE0" stroke-width="3"/>
    <rect x="-40" y="-52" width="80" height="46" rx="8" fill="#0A2A5E" stroke="#3D8FE0" stroke-width="2.5"/>
    <circle cx="0" cy="-30" r="10" fill="#F2A900"/>
    <path d="M0-52v-34" stroke="#3D8FE0" stroke-width="3"/>
    <circle cx="0" cy="-92" r="6" fill="#3D8FE0"/>
    <path d="M-140-40a150 150 0 0 1 280 0" fill="none" stroke="#3D8FE0" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 10"/>
  </g>
  <!-- blurred background figures -->
  <g fill="#FFFFFF" fill-opacity="0.08">
    <circle cx="640" cy="430" r="26"/>
    <path d="M600 520c0-30 18-48 40-48s40 18 40 48v30h-80z"/>
    <circle cx="960" cy="440" r="24"/>
    <path d="M922 524c0-28 17-44 38-44s38 16 38 44v28h-76z"/>
  </g>
  <!-- blueprint grid overlay -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 250h1600M0 500h1600M0 750h1600M400 0v1000M800 0v1000M1200 0v1000"/>
  </g>
  <text x="800" y="950" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="7" fill="#3D8FE0" fill-opacity="0.6">NIRO LAB · LAB SPACE PLACEHOLDER</text>
</svg>
