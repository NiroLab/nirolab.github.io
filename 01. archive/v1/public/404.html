<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NIRO Lab</title>
    <!--
      GitHub Pages SPA fallback (spa-github-pages pattern).
      A user/organization site (nirolab.github.io) serves from the domain root,
      so pathSegmentsToKeep = 0. The requested path is encoded into the query
      string; index.html decodes it back and React Router takes over.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
